name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Tidak perlu gradle wrapper: Gradle dipasang langsung oleh action ini.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Hanya saat push tag (mis. v1.0.0): build release dan buat GitHub Release.
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle :app:assembleRelease --stacktrace

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
